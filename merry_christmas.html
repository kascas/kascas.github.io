<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>粒子圣诞树 - 全平台交互版</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
            font-family: 'Arial', sans-serif;
            user-select: none;
            touch-action: none; /* 关键：禁止浏览器默认的缩放和滚动 */
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            gap: 15px; 
        }

        #main-title {
            position: relative;
            width: 100%;
            text-align: center;
            font-family: 'Mountains of Christmas', 'Brush Script MT', cursive; 
            font-size: 4rem;
            color: #fff;
            font-weight: bold;
            margin: 10px 0 0 0;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8), 
                0 0 20px rgba(255, 0, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4);
            pointer-events: none;
            z-index: 4;
            animation: titleBreath 4s ease-in-out infinite alternate;
            flex-shrink: 0;
        }

        @keyframes titleBreath {
            0% { opacity: 0.8; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6); transform: scale(1); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.6); transform: scale(1.05); }
        }

        #instructions {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            background: rgba(30, 30, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            font-size: 14px;
            margin-top: 0; 
            pointer-events: auto;
            transition: opacity 0.5s;
            cursor: pointer; 
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            #main-title {
                font-size: 3rem; 
                margin-top: 40px; 
            }
            #instructions {
                font-size: 12px;
                padding: 8px 15px;
            }
        }

        #quote-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.6);
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-out;
            pointer-events: none;
            width: 80%;
            max-width: 600px;
            font-family: 'Georgia', serif;
            z-index: 5;
        }

        #easter-egg-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            border: 8px solid #fff;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            background: #000;
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 80vh; 
            object-fit: contain;
        }
        
        ::-webkit-scrollbar { display: none; }

</head>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ---------------------------------------------------------
        // 1. 初始化场景
        // ---------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1a24, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 80;
        camera.position.y = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8; 
        
        container.appendChild(renderer.domElement);

        // ---------------------------------------------------------
        // 2. 灯光系统
        // ---------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); 
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(0xffaa00, 600, 200);
        mainLight.position.set(20, 20, 50);
        scene.add(mainLight);

        const blueLight = new THREE.PointLight(0x4444ff, 400, 200);
        blueLight.position.set(-30, 10, 30);
        scene.add(blueLight);
        
        const rimLight = new THREE.PointLight(0xff00ff, 300, 200);
        rimLight.position.set(0, -20, -30);
        scene.add(rimLight);
        
        const lightGroup = new THREE.Group();
        const colors = [0xff0000, 0x00ff00, 0x0000ff];
        colors.forEach((c, i) => {
            const l = new THREE.PointLight(c, 200, 100); 
            l.position.set(
                Math.cos(i * 2.09) * 40,
                Math.random() * 40 - 20,
                Math.sin(i * 2.09) * 40
            );
            lightGroup.add(l);
        });
        scene.add(lightGroup);

        // ---------------------------------------------------------
        // 3. 实例化网格
        // ---------------------------------------------------------
        const baseGeometry = new THREE.OctahedronGeometry(0.6, 0); 

        const baseMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 0.85, 
            roughness: 0.25, 
            flatShading: true,
            side: THREE.DoubleSide
        });

        const instanceCount = 3000; 
        const instancedMesh = new THREE.InstancedMesh(baseGeometry, baseMaterial, instanceCount);
        instancedMesh.frustumCulled = false;

        const aPosTree = new Float32Array(instanceCount * 3);
        const aPosSphere = new Float32Array(instanceCount * 3);
        const aRandom = new Float32Array(instanceCount); 

        const dummy = new THREE.Object3D();
        
        const leafColors = [
            new THREE.Color(0x1a5d1a),
            new THREE.Color(0x2d8a27),
            new THREE.Color(0x004d40),
        ];
        const ornamentColors = [
            new THREE.Color(0xd00000),
            new THREE.Color(0xffb700),
            new THREE.Color(0x0088ff),
            new THREE.Color(0xc0c0c0),
        ];

        function getTreeRadius(normalizedHeight) {
            const baseCone = (1.0 - normalizedHeight) * 18.0;
            const layers = 6.0;
            const layerProgress = (normalizedHeight * layers) % 1.0;
            const branchFlare = 6.0 * Math.pow(1.0 - layerProgress, 1.5) * (1.0 - normalizedHeight * 0.8);
            return baseCone + branchFlare;
        }

        for (let i = 0; i < instanceCount; i++) {
            const angle = Math.random() * Math.PI * 2 * 25;
            const height = Math.random() * 60 - 30; 
            const normalizedHeight = (height + 30) / 60;
            const maxRadius = getTreeRadius(normalizedHeight);
            const rRandom = Math.sqrt(Math.random()); 
            const spiralRadius = maxRadius * rRandom + (Math.random() - 0.5) * 1.5;

            aPosTree[i*3] = spiralRadius * Math.cos(angle);
            aPosTree[i*3+1] = height;
            aPosTree[i*3+2] = spiralRadius * Math.sin(angle);

            const r = 35 + Math.random() * 10;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            aPosSphere[i*3] = r * Math.sin(phi) * Math.cos(theta);
            aPosSphere[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            aPosSphere[i*3+2] = r * Math.cos(phi);

            let isOrnament = false;
            if (Math.random() > 0.85) isOrnament = true;

            if (isOrnament) {
                instancedMesh.setColorAt(i, ornamentColors[Math.floor(Math.random() * ornamentColors.length)]);
            } else {
                let c = leafColors[Math.floor(Math.random() * leafColors.length)];
                if (Math.random() > 0.5) c = c.clone().multiplyScalar(0.8);
                instancedMesh.setColorAt(i, c);
            }

            aRandom[i] = Math.random();
            dummy.position.set(0,0,0);
            dummy.rotation.set(0,0,0);
            dummy.scale.set(1,1,1);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
        }

        baseGeometry.setAttribute('aPosTree', new THREE.InstancedBufferAttribute(aPosTree, 3));
        baseGeometry.setAttribute('aPosSphere', new THREE.InstancedBufferAttribute(aPosSphere, 3));
        baseGeometry.setAttribute('aRandom', new THREE.InstancedBufferAttribute(aRandom, 1));

        scene.add(instancedMesh);
        
        // ---------------------------------------------------------
        // 4. Shader 注入
        // ---------------------------------------------------------
        const uniforms = {
            mixRatio: { value: 0.0 },
            time: { value: 0.0 }
        };

        baseMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uMixRatio = uniforms.mixRatio;
            shader.uniforms.uTime = uniforms.time;

            shader.vertexShader = `
                uniform float uMixRatio;
                uniform float uTime;
                attribute vec3 aPosTree;
                attribute vec3 aPosSphere;
                attribute float aRandom;
                
                vec3 rotate(vec3 v, vec3 axis, float angle) {
                    return mix(dot(axis, v) * axis, v, cos(angle)) + cross(axis, v) * sin(angle);
                }
            ` + shader.vertexShader;

            shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                `
                vec3 transformed = vec3( position );
                
                float scale = 0.5 + aRandom * 1.0; 
                transformed *= scale;
                transformed *= vec3(0.8 + 0.4*sin(aRandom*10.0), 0.8 + 0.4*cos(aRandom*20.0), 0.8 + 0.4*sin(aRandom*30.0));
                
                vec3 axis = normalize(vec3(sin(aRandom), cos(aRandom), aRandom));
                transformed = rotate(transformed, axis, aRandom * 6.28);

                vec3 targetOffset = mix(aPosTree, aPosSphere, uMixRatio);

                float floatSpeed = 0.5 + aRandom * 0.5;
                targetOffset.x += sin(uTime * 1.5 * floatSpeed + targetOffset.y) * 0.2 * uMixRatio;
                targetOffset.y += cos(uTime * 1.0 * floatSpeed + targetOffset.x) * 0.2 * uMixRatio;
                
                transformed += targetOffset;
                `
            );
        };

        // ---------------------------------------------------------
        // 5. 背景雪花
        // ---------------------------------------------------------
        function createSnowflakeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'transparent';
            ctx.fillRect(0,0,32,32);
            ctx.translate(16,16);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for(let i=0; i<6; i++) {
                ctx.rotate(Math.PI/3);
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,12);
                ctx.moveTo(0,6); ctx.lineTo(3,9);
                ctx.moveTo(0,6); ctx.lineTo(-3,9);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }
        
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = [];
        const snowVel = [];
        for(let i=0; i<500; i++) {
            snowPos.push((Math.random()-0.5)*200, (Math.random()-0.5)*100+20, (Math.random()-0.5)*100-20);
            snowVel.push(0.05 + Math.random()*0.1);
        }
        snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(snowPos, 3));
        const snowMat = new THREE.PointsMaterial({
            color: 0xffffff, size: 2.0, map: createSnowflakeTexture(),
            transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const snowSystem = new THREE.Points(snowGeo, snowMat);
        scene.add(snowSystem);

        // ---------------------------------------------------------
        // 6. 交互逻辑 (全平台优化版)
        // ---------------------------------------------------------
        
        let isDragging = false;
        let isUserInteracting = false;
        let hasMoved = false;
        let startPointerPosition = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };
        
        let rotationVelocity = 0.002; 
        const FRICTION = 0.975; 
        const SENSITIVITY = 0.005;
        
        let morphValue = 0; 
        let targetMorphValue = 0; 

        // 语料库
        const quotes = [
            "🎄 Merry Christmas! 愿你拥有温暖的冬日。",

        const posterUrls = [
            "https://images.ctfassets.net/1fvlg6xqnm65/2025-race-miami-race-0/7d18fbbd8df3c2dd11fe98a5d6890fdc/M502920.jpg",

        ];

        document.addEventListener('mousedown', onPointerDown);
        document.addEventListener('touchstart', onTouchStart, { passive: false });
        
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchend', onPointerUp);

        let initialPinchDistance = null;
        let initialMorphValueAtPinch = 0;

        function onPointerDown(e) {
            isUserInteracting = true;
            hasMoved = false;
            startPointerPosition = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isUserInteracting = true;
                hasMoved = false;
                startPointerPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                // 双指捏合开始
                isUserInteracting = false; 
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                initialMorphValueAtPinch = targetMorphValue;
                e.preventDefault(); 
            }
        }

        function onPointerMove(e) {
            if (!isUserInteracting) return;
            const clientX = e.clientX;
            const clientY = e.clientY;
            
            if (!isDragging) {
                const dx = clientX - startPointerPosition.x;
                const dy = clientY - startPointerPosition.y;
                if (Math.sqrt(dx * dx + dy * dy) > 5) {
                    isDragging = true;
                    hasMoved = true;
                    rotationVelocity = 0;
                }
            }
            
            if (isDragging) {
                const deltaX = clientX - previousMousePosition.x;
                rotationVelocity = deltaX * SENSITIVITY;
                instancedMesh.rotation.y += rotationVelocity;
                snowSystem.rotation.y += rotationVelocity * 0.3; 
                previousMousePosition = { x: clientX, y: clientY };
            }
        }

        function onTouchMove(e) {
            if (e.touches.length === 1 && isUserInteracting) {
                const clientX = e.touches[0].clientX;
                const clientY = e.touches[0].clientY;
                
                if (!isDragging) {
                    const dx = clientX - startPointerPosition.x;
                    const dy = clientY - startPointerPosition.y;
                    if (Math.sqrt(dx * dx + dy * dy) > 5) {
                        isDragging = true;
                        hasMoved = true;
                        rotationVelocity = 0;
                    }
                }
                
                if (isDragging) {
                    const deltaX = clientX - previousMousePosition.x;
                    rotationVelocity = deltaX * SENSITIVITY;
                    instancedMesh.rotation.y += rotationVelocity;
                    snowSystem.rotation.y += rotationVelocity * 0.3;
                    previousMousePosition = { x: clientX, y: clientY };
                }
                
            } else if (e.touches.length === 2 && initialPinchDistance) {
                // 双指捏合逻辑
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                
                const delta = (currentDistance - initialPinchDistance) * 0.005;
                
                // 限制在 0 和 1 之间
                targetMorphValue = Math.max(0, Math.min(1, initialMorphValueAtPinch + delta));
                
                e.preventDefault();
            }
        }

        function onPointerUp() {
            isUserInteracting = false;
            isDragging = false;
            initialPinchDistance = null;
        }

        function onDoubleClick(e) {
            targetMorphValue = targetMorphValue === 0 ? 1 : 0;
            if (targetMorphValue === 0) {
                clearAllDisplays();
            }
            triggerRipple();
        }

        function onInteractClick(e) {
            // 如果发生了拖动，则不认为是点击
            if (hasMoved) return;
            
            if (morphValue > 0.6) {
                if (Math.random() < 0.15) {
                    showEasterEgg();
                } else {
                    showRandomQuote();
                }
                triggerRipple();
            }
        }
        
        const quoteBox = document.getElementById('quote-box');
        const easterEggBox = document.getElementById('easter-egg-box');
        const easterEggImg = document.getElementById('easter-egg-img');
        
        let quoteTimeout;
        let easterEggTimeout;
        
        function clearAllDisplays() {
            if (quoteTimeout) clearTimeout(quoteTimeout);
            if (easterEggTimeout) clearTimeout(easterEggTimeout);
            
            easterEggImg.onload = null;

            quoteBox.style.opacity = 0;
            quoteBox.style.transform = "translate(-50%, -50%) scale(1)";
            
            easterEggBox.style.opacity = 0;
            easterEggBox.style.transform = "translate(-50%, -50%) scale(0.5)";
        }
        
        let availableQuotes = [...quotes];
        
        function getUniqueRandomQuote() {
            if (availableQuotes.length === 0) {
                availableQuotes = [...quotes];
            }
            const randomIndex = Math.floor(Math.random() * availableQuotes.length);
            return availableQuotes.splice(randomIndex, 1)[0];
        }

        let availablePosters = [...posterUrls];

        function getUniqueRandomPoster() {
            if (availablePosters.length === 0) {
                availablePosters = [...posterUrls];
            }
            const randomIndex = Math.floor(Math.random() * availablePosters.length);
            return availablePosters.splice(randomIndex, 1)[0];
        }

        function showRandomQuote() {
            clearAllDisplays();
            
            const randomQuote = getUniqueRandomQuote();
            quoteBox.innerText = randomQuote;
            
            quoteBox.style.opacity = 1;
            quoteBox.style.transform = "translate(-50%, -50%) scale(1.1)";
            
            quoteTimeout = setTimeout(() => {
                quoteBox.style.opacity = 0;
                quoteBox.style.transform = "translate(-50%, -50%) scale(1)";
            }, 3000);
        }

        function showEasterEgg() {
            clearAllDisplays();
            
            const randomPoster = getUniqueRandomPoster();
            
            easterEggImg.onload = () => {
                easterEggBox.style.opacity = 1;
                easterEggBox.style.transform = "translate(-50%, -50%) scale(1)";
                
                easterEggTimeout = setTimeout(() => {
                    easterEggBox.style.opacity = 0;
                    easterEggBox.style.transform = "translate(-50%, -50%) scale(0.5)";
                }, 3000);
            };
            
            easterEggImg.src = randomPoster;
        }

        let timeSurge = 0;
        function triggerRipple() {
            timeSurge = 20.0; 
        }

        // ---------------------------------------------------------
        // 7. 动画循环
        // ---------------------------------------------------------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (timeSurge > 0) {
                timeSurge *= 0.95; 
                if (timeSurge < 0.01) timeSurge = 0;
            }
            uniforms.time.value += delta * (1.0 + timeSurge);

            const time = uniforms.time.value;
            lightGroup.rotation.y = time * 0.5;
            
            morphValue += (targetMorphValue - morphValue) * 0.04;
            uniforms.mixRatio.value = morphValue;

            if (!isDragging) {
                instancedMesh.rotation.y += rotationVelocity;
                snowSystem.rotation.y += rotationVelocity * 0.3; 
                rotationVelocity *= FRICTION;
                if (Math.abs(rotationVelocity) < 0.001) {
                    rotationVelocity += (0.001 - rotationVelocity) * 0.05;
                }
            }
            
            const positions = snowSystem.geometry.attributes.position.array;
            for(let i=0; i<500; i++) {
                positions[i*3 + 1] -= snowVel[i];
                if (positions[i*3 + 1] < -50) {
                    positions[i*3 + 1] = 50;
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;

            const instructions = document.getElementById('instructions');
            if (morphValue > 0.8) {
                instructions.style.opacity = 0.3; 
            } else {
                instructions.style.opacity = 1.0;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
